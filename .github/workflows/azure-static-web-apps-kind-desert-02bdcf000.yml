name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "client/camp-booking-react/**"
      - ".github/workflows/azure-static-web-apps-kind-desert-02bdcf000.yml"

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/camp-booking-react/package-lock.json

      - name: Install dependencies
        working-directory: client/camp-booking-react
        run: npm ci

      - name: Build React App
        working-directory: client/camp-booking-react
        env:
          VITE_API_BASE_URL: https://campbooking-api-vaibhav-fyduhfcyg2e4egfe.centralindia-01.azurewebsites.net/api
        run: npm run build

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_FOREST_0FEE7CE00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "./client/camp-booking-react/dist"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_FOREST_0FEE7CE00 }}
          action: close
