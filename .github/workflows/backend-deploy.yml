name: Backend Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CampBookingSystem.slnx

      - name: Build
        run: dotnet build CampBookingSystem.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/CampBooking.Tests/CampBooking.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/CampBooking.Api/CampBooking.Api.csproj -c Release --no-build -o publish

      - name: Deploy
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
